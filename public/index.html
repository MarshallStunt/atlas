<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04060c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aura">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="stylesheet" href="/style.css">
<title>Aura</title>
</head>
<body>
<div class="bg" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i><i class="grid"></i></div>

<section id="login" hidden>
  <div class="login-box">
    <canvas class="orb-canvas" id="login-orb" width="320" height="320"></canvas>
    <h1>AURA</h1>
    <p id="login-hint" class="dim">Enter your PIN</p>
    <form id="login-form">
      <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" pattern="[0-9]*" placeholder="• • • • • •" aria-label="PIN">
      <input id="pin2" type="password" inputmode="numeric" pattern="[0-9]*" placeholder="repeat PIN" aria-label="Repeat PIN" hidden>
      <input id="setup-code" autocomplete="off" autocapitalize="characters" placeholder="setup code from the hub log" aria-label="Setup code" hidden>
      <button class="btn glow" type="submit" id="login-btn">Unlock</button>
    </form>
    <p id="login-error" class="error"></p>
  </div>
</section>

<section id="main" hidden>
  <header class="top">
    <button class="sys" id="sys-pill" aria-label="Computer status"><span class="dot"></span><span id="device-name">—</span><span class="mono dim" id="device-meta"></span></button>
    <div class="clock mono" id="clock"></div>
  </header>

  <div id="approvals"></div>

  <main>
    <div class="view" id="view-now"></div>

    <div class="view" id="view-talk" hidden>
      <div class="stage">
        <canvas class="orb-canvas big" id="stage-orb" width="560" height="560"></canvas>
        <div class="stage-state mono" id="stage-state">TAP THE ORB TO TALK</div>
        <div class="stage-live" id="stage-live"></div>
      </div>
      <div class="talk-bar">
        <button class="chip" id="new-chat">＋ New</button>
        <button class="chip toggle" id="hands-free" aria-pressed="false"><span class="led"></span>Hands-free</button>
        <button class="chip toggle" id="speak-toggle" aria-pressed="true"><span class="led"></span>Voice replies</button>
      </div>
      <div id="chat"></div>
      <div class="suggest" id="suggestions"></div>
    </div>

    <div class="view" id="view-screen" hidden>
      <div class="panel">
        <div class="panel-head"><span class="label">Live screen</span><button class="btn glow sm" id="shot-btn">Capture</button></div>
        <p class="dim" id="shot-note">See what's on your computer right now. Needs “View the screen” switched on at the computer.</p>
        <div class="shot-wrap"><img id="shot" alt="Screenshot of the computer" hidden><div class="scan" hidden id="scan"></div></div>
        <div class="row-actions" id="shot-actions" hidden><button class="btn sm" data-ask="Look at my screen and tell me what needs my attention.">Ask about it</button></div>
      </div>
    </div>

    <div class="view" id="view-system" hidden></div>
  </main>

  <form class="composer" id="composer" hidden>
    <input id="ask-input" placeholder="Type to Aura…" autocomplete="off" enterkeyhint="send">
    <button class="btn glow sm" type="submit">Send</button>
  </form>

  <nav class="dock">
    <button data-view="now" class="active" aria-label="Now"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg><span>Now</span></button>
    <button data-view="talk" aria-label="Talk"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg><span>Talk</span></button>
    <button class="orb-btn" id="orb-btn" aria-label="Talk to Aura"><canvas class="orb-canvas" id="dock-orb" width="200" height="200"></canvas></button>
    <button data-view="screen" aria-label="Screen"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg><span>Screen</span></button>
    <button data-view="system" aria-label="System"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>System</span></button>
  </nav>
</section>

<div id="sheet" class="sheet" hidden><div class="sheet-card" id="sheet-card"></div></div>
<div id="toast" role="status"></div>
<audio id="voice-out" playsinline></audio>
<script src="/app.js" type="module"></script>
</body>
</html>
