<!doctype html><html><head><meta charset="utf-8"><title>Atlas Bridge</title>
<style>
:root{color-scheme:dark;--bg:#0a0d17;--card:#121725;--line:rgba(255,255,255,.08);--text:#eef2ff;--dim:#8a93b2;--ok:#a3e635;--warn:#fbbf24;--bad:#fb7185;--acc:#22d3ee}
*{box-sizing:border-box}body{margin:0;width:340px;background:var(--bg);color:var(--text);font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
header{display:flex;align-items:center;gap:10px;padding:14px 14px 10px}header img{width:30px;height:30px}header b{font-size:15px}
.space{margin-left:auto;font:600 11px ui-monospace,Menlo,monospace;letter-spacing:.06em;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--acc)}
.status{margin:0 14px 10px;padding:10px 12px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:flex;gap:10px;align-items:center}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--dim)}.ok .dot{background:var(--ok);box-shadow:0 0 8px var(--ok)}.warn .dot{background:var(--warn)}.signin .dot,.bad .dot{background:var(--bad);box-shadow:0 0 8px var(--bad)}.off{opacity:.5}
.apps{margin:0 14px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.app{display:flex;gap:10px;align-items:center;padding:9px 12px;border-top:1px solid var(--line)}.app:first-child{border-top:0}
.app .n{font-weight:600}.app .t{color:var(--dim);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:240px}
.actions{display:flex;gap:8px;padding:12px 14px}
button{flex:1;font:600 13px inherit;border-radius:10px;padding:9px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer}
button.primary{border:0;background:linear-gradient(120deg,#22d3ee,#a78bfa 60%,#f472b6);color:#04060c}
.when{color:var(--dim);font-size:11px;padding:0 14px}
details{margin:6px 14px 14px;color:var(--dim)}summary{cursor:pointer;font-size:12px}
label{display:block;margin:8px 0 3px;font-size:11px}input{width:100%;padding:7px 9px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit}
.save{margin-top:8px;width:100%}
</style></head><body>
<header><img src="icons/icon48.png" alt=""><b>Atlas Bridge</b><span class="space" id="space" hidden></span></header>
<div class="status" id="status"><span class="dot"></span><div><div id="statusText">Checking…</div><div class="when" style="padding:0" id="when"></div></div></div>
<div class="apps" id="apps"></div>
<div class="actions"><button id="sync">↻ Sync now</button><button class="primary" id="open">Open Atlas</button></div>
<details><summary>Advanced</summary>
  <label for="agent">Atlas agent on this computer</label><input id="agent" placeholder="http://127.0.0.1:8101">
  <button class="save" id="save">Save</button>
</details>
<script src="popup.js"></script></body></html>
